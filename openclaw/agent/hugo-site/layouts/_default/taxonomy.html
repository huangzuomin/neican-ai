{{ define "main" }}
<div class="taxonomy-listing">
  <header class="page-header">
    <p class="eyebrow">分类浏览</p>
    <h1>{{ .Title }}</h1>
    {{ with .Content }}<div class="page-intro">{{ . }}</div>{{ end }}
  </header>

  <div class="taxonomy-terms">
    {{ range .Data.Terms.Alphabetical }}
    <a href="{{ .Page.RelPermalink }}" class="taxonomy-term-card">
      <span class="tt-name">{{ .Page.Title }}</span>
      <span class="tt-count">{{ .Count }}</span>
    </a>
    {{ else }}
    <p>暂无内容。</p>
    {{ end }}
  </div>
</div>
{{ end }}
